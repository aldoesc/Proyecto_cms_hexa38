services:
  hexa38_cms_server:
    build: .
    container_name: hexa38_cms_server
    ports:
      - "8080:5000"
    restart: unless-stopped
    environment:
      # Las claves van en un archivo .env junto a este compose (ver .env.example),
      # NO aquí: así cada tienda tiene las suyas y este archivo se puede actualizar
      # desde el repositorio sin pisarlas.
      - SECRET_KEY=${SECRET_KEY:-hexa38_secret_key_change_in_production}
      - API_KEY=${API_KEY:-hexa38-totem-key-change-me}
      - DATA_DIR=/app/data
      # Hora local en el panel y en los registros
      - TZ=${TZ:-America/Lima}
    volumes:
      - cms_media:/app/media
      - cms_db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # El access log registra cada latido: se limita para no llenar el disco
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cms_media:
  cms_db:
