{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-shield-lock"></i> Cambiar Contraseña</h5>
                </div>
                <div class="card-body">

                    <form method="POST" action="{{ url_for('cambiar_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="password_actual" class="form-label">Contraseña actual</label>
                            <input type="password" class="form-control" id="password_actual" 
                                   name="password_actual" required placeholder="Ingresa tu contraseña actual">
                        </div>
                        <div class="mb-3">
                            <label for="password_nueva" class="form-label">Nueva contraseña</label>
                            <input type="password" class="form-control" id="password_nueva" 
                                   name="password_nueva" required placeholder="Ingresa la nueva contraseña">
                        </div>
                        <div class="mb-4">
                            <label for="password_confirmar" class="form-label">Confirmar nueva contraseña</label>
                            <input type="password" class="form-control" id="password_confirmar" 
                                   name="password_confirmar" required placeholder="Repite la nueva contraseña">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar cambios
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Validar que las contraseñas coincidan antes de enviar
    document.querySelector('form').addEventListener('submit', function(e) {
        const nueva = document.getElementById('password_nueva').value;
        const confirmar = document.getElementById('password_confirmar').value;
        if (nueva !== confirmar) {
            e.preventDefault();
            alert('Las contraseñas nuevas no coinciden.');
        }
    });
</script>
{% endblock %}
